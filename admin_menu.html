<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>團主開團與點餐</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-orange-50 flex items-center justify-center min-h-screen p-4">
  <div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-lg">
    <div class="flex justify-between items-center mb-4">
      <h1 class="text-2xl font-bold text-orange-600">🍱 團主開團與點餐</h1>
      <button onclick="location.href='index.html'" class="text-sm px-3 py-1 bg-gray-200 rounded hover:bg-gray-300">回首頁</button>
    </div>

    <!-- 步驟 1: 上傳菜單圖片 -->
    <div class="mb-6 p-4 border rounded-lg bg-orange-50/50">
      <label class="block text-sm font-bold text-gray-700 mb-2">步驟 1：上傳今日菜單圖片</label>
      <input type="file" id="menuUpload" accept="image/*" class="w-full text-sm mb-3" />
      <button type="button" id="uploadMenuBtn" class="w-full py-2 bg-orange-500 text-white rounded font-bold hover:bg-orange-600 transition">AI 辨識並建立今日菜單</button>
      <div id="status" class="text-sm text-gray-600 mt-2 font-medium hidden">正在處理中...</div>
    </div>

    <!-- 步驟 2: 辨識成功後，自動出現團主點餐區 -->
    <div id="orderSection" class="border-t pt-4 hidden">
      <h3 class="font-bold text-gray-800 mb-2">步驟 2：團主先行點餐</h3>
      <p class="text-xs text-gray-500 mb-3">菜單辨識成功！請填入您的姓名並勾選想吃的品項：</p>

      <label class="block text-sm font-bold text-gray-700 mb-1">團主姓名</label>
      <input type="text" id="adminNameInput" placeholder="請輸入團主姓名" class="w-full p-2 border rounded mb-3" />

      <label class="block text-sm font-bold text-gray-700 mb-1">勾選餐點</label>
      <div class="max-h-60 overflow-y-auto border rounded mb-4">
        <table class="w-full text-left text-sm">
          <thead>
            <tr class="bg-gray-100 border-b">
              <th class="p-2">餐點</th>
              <th class="p-2">價格</th>
              <th class="p-2 text-center">選擇</th>
            </tr>
          </thead>
          <tbody id="menuTableBody"></tbody>
        </table>
      </div>

      <button type="button" id="adminSubmitBtn" class="w-full py-2 bg-green-600 text-white rounded font-bold hover:bg-green-700 transition">下一步：送出並產生分享連結</button>
    </div>

    <!-- 步驟 3: 團主點完餐後，產生專屬網址 -->
    <div id="nextStepSection" class="border-t pt-5 mt-5 hidden">
      <div class="p-4 bg-green-50 border border-green-200 rounded-xl text-center">
        <div class="text-green-700 font-bold text-base mb-1">🎉 步驟 3：開團成功！</div>
        <p class="text-xs text-gray-600 mb-3">請複製下方網址發到 LINE 群組，同事點開即可開始點餐：</p>
        
        <input type="text" id="shareUrl" readonly class="w-full text-xs p-2 border rounded bg-white text-gray-700 mb-3 text-center font-mono" />
        
        <div class="flex gap-2">
          <button type="button" id="copyBtn" class="w-full py-2 bg-green-600 text-white rounded text-sm font-bold hover:bg-green-700 transition">📋 一鍵複製點餐連結</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { db } from "./firebase.js";
    import { doc, setDoc, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // ⚠️ 請確保 p1, p2, p3 拼起來是完整的 Gemini API Key（開頭是 AIzaSy...）
    const p1 = "AIzaSy..."; // 替換為你的第一段（包含 AIzaSy 開頭）
    const p2 = "...";       // 替換為第二段
    const p3 = "...";       // 替換為第三段

    const apiKey = p1 + p2 + p3;
    const today = new Date().toISOString().split("T")[0];

    // 步驟 1：點擊開始辨識
    document.getElementById("uploadMenuBtn").addEventListener("click", async () => {
      const fileInput = document.getElementById("menuUpload");
      const statusDiv = document.getElementById("status");

      if (!fileInput.files[0]) {
        return alert("請先點選『選擇檔案』上傳一張菜單圖片！");
      }

      const file = fileInput.files[0];
      statusDiv.classList.remove("hidden");
      statusDiv.innerText = "⏳ AI 正在辨識菜單內容，請稍候...";

      const reader = new FileReader();
      reader.onloadend = async () => {
        try {
          const base64Image = reader.result.split(",")[1];
          
          // 使用修正後的 gemini-2.5-flash 與正確的 apiKey 變數
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: [{
                parts: [
                  { text: "請辨識圖片中的菜單品項與單價。只輸出純數字 JSON 陣列格式：[{\"name\":\"餐點名稱\",\"price\":100}]，單價請為數字，不要帶說明文字或 Markdown 代碼標記。" },
                  { inline_data: { mime_type: file.type || "image/png", data: base64Image } }
                ]
              }],
              generationConfig: { response_mime_type: "application/json" }
            })
          });

          const result = await response.json();

          if (result.error) {
            throw new Error(`Google API 錯誤 [${result.error.code}]: ${result.error.message}`);
          }

          if (!result.candidates || !result.candidates[0]?.content?.parts?.[0]?.text) {
            throw new Error("AI 無法辨識該圖片，請確認圖片是否清晰。");
          }

          const rawText = result.candidates[0].content.parts[0].text;
          const items = JSON.parse(rawText.replace(/```json|```/g, "").trim());

          if (!Array.isArray(items) || items.length === 0) {
            throw new Error("未能成功解析出餐點，請更換菜單圖片重試。");
          }

          // 寫入今日菜單到 Firebase
          await setDoc(doc(db, "daily_menus", today), {
            date: today,
            items: items,
            updatedAt: new Date().toISOString()
          });

          // 動態生成勾選表格
          let html = "";
          items.forEach(item => {
            html += `<tr class="border-b">
              <td class="p-2">${item.name}</td>
              <td class="p-2">$${item.price}</td>
              <td class="p-2 text-center">
                <input type="checkbox" class="item" data-name="${item.name}" data-price="${item.price}">
              </td>
            </tr>`;
          });
          document.getElementById("menuTableBody").innerHTML = html;

          // 解鎖步驟 2（團主點餐）
          document.getElementById("orderSection").classList.remove("hidden");
          statusDiv.innerText = "✔ 菜單辨識完成！請在下方進行步驟 2。";
          document.getElementById("orderSection").scrollIntoView({ behavior: "smooth" });
        } catch (err) {
          console.error(err);
          alert("執行中斷：" + err.message);
          statusDiv.innerText = "處理失敗。";
        }
      };
      reader.readAsDataURL(file);
    });

    // 步驟 2：團主送出訂單
    document.getElementById("adminSubmitBtn").addEventListener("click", async () => {
      const name = document.getElementById("adminNameInput").value.trim();
      if (!name) return alert("請輸入團主姓名！");

      const items = [];
      document.querySelectorAll(".item:checked").forEach(cb => {
        items.push({ name: cb.dataset.name, price: parseInt(cb.dataset.price) });
      });

      if (items.length === 0) return alert("請至少勾選一項餐點！");

      try {
        await addDoc(collection(db, "orders"), {
          person: name,
          items,
          date: today,
          timestamp: new Date().toISOString()
        });

        // 產生同事點餐連結
        const orderUrl = window.location.href.replace("admin_menu.html", "order.html");
        document.getElementById("shareUrl").value = orderUrl;

        // 解鎖步驟 3
        document.getElementById("nextStepSection").classList.remove("hidden");
        document.getElementById("nextStepSection").scrollIntoView({ behavior: "smooth" });
        alert(`✔ 團主【${name}】點餐已送出！請複製步驟 3 的連結發給同事。`);
      } catch (err) {
        alert("儲存訂單失敗：" + err.message);
      }
    });

    // 步驟 3：一鍵複製連結
    document.getElementById("copyBtn").addEventListener("click", () => {
      const shareUrlInput = document.getElementById("shareUrl");
      shareUrlInput.select();
      navigator.clipboard.writeText(shareUrlInput.value);
      alert("✔ 點餐連結已複製到剪貼簿！可直接貼至 LINE 群組。");
    });
  </script>
</body>
</html>
