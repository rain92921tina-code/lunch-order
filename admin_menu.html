<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>團主開團與點餐</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-orange-50 min-h-screen p-4 md:p-8 flex justify-center items-start">
  <div class="bg-white p-6 md:p-8 rounded-2xl shadow-xl w-full max-w-4xl">
    
    <!-- 頂部標題與捷徑 -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 border-b pb-4 mb-6">
      <div>
        <h1 class="text-2xl md:text-3xl font-extrabold text-orange-600">🍱 團主開團與點餐</h1>
        <p class="text-xs sm:text-sm text-gray-500 mt-1">上傳菜單圖片自動辨識，並產生同事點餐連結</p>
      </div>
      <div class="flex gap-2 w-full sm:w-auto">
        <button onclick="location.href='mode4.html'" class="flex-1 sm:flex-none px-4 py-2 bg-purple-100 hover:bg-purple-200 text-purple-700 font-bold rounded-lg text-sm transition">
          📊 查看大家點了什麼
        </button>
        <button onclick="location.href='index.html'" class="px-3 py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded-lg text-sm transition">
          首頁
        </button>
      </div>
    </div>

    <!-- 步驟 1: 上傳菜單圖片 -->
    <div class="mb-6 p-5 border rounded-xl bg-orange-50/50">
      <label class="block text-base font-bold text-gray-800 mb-2">步驟 1：上傳今日菜單圖片</label>
      <input type="file" id="menuUpload" accept="image/*" class="w-full text-sm mb-4" />
      <button type="button" id="uploadMenuBtn" class="w-full py-3 bg-orange-500 hover:bg-orange-600 text-white rounded-xl font-bold transition shadow text-base">
        🔍 AI 辨識並建立今日菜單
      </button>
      <div id="status" class="text-sm text-gray-600 mt-2 font-medium hidden">正在處理中...</div>
    </div>

    <!-- 步驟 2: 團主先行點餐 (改為加減數量) -->
    <div id="orderSection" class="border-t pt-6 hidden">
      <div class="flex justify-between items-center mb-2">
        <h3 class="text-lg font-bold text-gray-800">步驟 2：團主先行點餐</h3>
        <span id="adminTotalPiecesText" class="text-xs text-orange-600 font-bold">已選 0 份</span>
      </div>
      <p class="text-xs text-gray-500 mb-4">菜單辨識成功！請填入您的姓名並按「+ / -」選擇數量：</p>

      <div class="mb-4">
        <label class="block text-sm font-bold text-gray-700 mb-1">團主姓名：</label>
        <input type="text" id="adminNameInput" placeholder="請輸入團主姓名" class="w-full p-3 border rounded-xl bg-gray-50 focus:bg-white focus:ring-2 focus:ring-orange-400 outline-none" />
      </div>

      <label class="block text-sm font-bold text-gray-700 mb-2">餐點品項與數量：</label>
      <div class="max-h-80 overflow-y-auto border rounded-xl mb-4">
        <table class="w-full text-left text-sm">
          <thead class="bg-gray-100 border-b sticky top-0">
            <tr>
              <th class="p-3 font-bold text-gray-700">餐點</th>
              <th class="p-3 font-bold text-gray-700 text-center">價格</th>
              <th class="p-3 font-bold text-gray-700 text-center w-36">數量</th>
            </tr>
          </thead>
          <tbody id="menuTableBody" class="divide-y"></tbody>
        </table>
      </div>

      <div class="flex justify-between items-center mb-4 px-1">
        <span class="text-sm font-bold text-gray-700">團主點餐金額小計：</span>
        <span id="adminTotalAmountText" class="text-xl font-extrabold text-orange-600">$0</span>
      </div>

      <button type="button" id="adminSubmitBtn" class="w-full py-3 bg-green-600 hover:bg-green-700 text-white rounded-xl font-bold transition shadow text-base">
        下一步：送出並產生分享連結
      </button>
    </div>

    <!-- 步驟 3: 產生專屬網址與跳轉按鈕 -->
    <div id="nextStepSection" class="border-t pt-6 mt-6 hidden">
      <div class="p-5 bg-green-50 border border-green-200 rounded-xl text-center">
        <div class="text-green-800 font-extrabold text-lg mb-1">🎉 步驟 3：開團成功！</div>
        <p class="text-xs text-gray-600 mb-3">請複製下方網址發到 LINE 群組，同事點開即可開始點餐：</p>
        
        <input type="text" id="shareUrl" readonly class="w-full text-xs sm:text-sm p-3 border rounded-xl bg-white text-gray-700 mb-4 text-center font-mono" />
        
        <div class="flex flex-col sm:flex-row gap-3">
          <button type="button" id="copyBtn" class="flex-1 py-3 bg-green-600 hover:bg-green-700 text-white rounded-xl text-sm font-bold transition shadow">
            📋 一鍵複製點餐連結發 LINE
          </button>
          <button type="button" onclick="location.href='mode4.html'" class="flex-1 py-3 bg-purple-600 hover:bg-purple-700 text-white rounded-xl text-sm font-bold transition shadow">
            📊 前往查看大家點餐匯總
          </button>
        </div>
      </div>
    </div>

  </div>

  <script type="module">
    import { db } from "./firebase.js";
    import { doc, getDoc, setDoc, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const today = new Date().toISOString().split("T")[0];

    const MODELS_QUEUE = [
      "gemini-3.6-flash",
      "gemini-2.0-flash",
      "gemini-2.0-flash-lite",
      "gemini-1.5-flash"
    ];

    const wait = (ms) => new Promise(res => setTimeout(res, ms));

    document.getElementById("uploadMenuBtn").addEventListener("click", async () => {
      const fileInput = document.getElementById("menuUpload");
      const statusDiv = document.getElementById("status");

      if (!fileInput.files[0]) {
        return alert("請先點選『選擇檔案』上傳一張菜單圖片！");
      }

      const file = fileInput.files[0];
      statusDiv.classList.remove("hidden");
      statusDiv.innerText = "⏳ 正在讀取金鑰設定...";

      try {
        const configDoc = await getDoc(doc(db, "config", "gemini"));
        if (!configDoc.exists() || !configDoc.data().key) {
          throw new Error("找不到 Firebase 金鑰設定，請確認 config/gemini 集合。");
        }
        const apiKey = configDoc.data().key.trim();

        const reader = new FileReader();
        reader.onloadend = async () => {
          try {
            const base64Image = reader.result.split(",")[1];
            const promptText = "請辨識圖片中的菜單品項與單價。只輸出純數字 JSON 陣列格式：[{\"name\":\"餐點名稱\",\"price\":100}]，單價請為數字，不要帶說明文字或 Markdown 代碼標記。";

            let result = null;
            let lastErrorMsg = "";

            for (const model of MODELS_QUEUE) {
              for (let retry = 0; retry < 2; retry++) {
                try {
                  statusDiv.innerText = `⏳ AI 辨識中 (${model}${retry > 0 ? ' 重試中' : ''})...`;
                  
                  const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`, {
                    method: "POST",
                    headers: {
                      "Content-Type": "application/json",
                      "x-goog-api-key": apiKey
                    },
                    body: JSON.stringify({
                      contents: [{
                        parts: [
                          { text: promptText },
                          { inline_data: { mime_type: file.type || "image/png", data: base64Image } }
                        ]
                      }],
                      generationConfig: { response_mime_type: "application/json" }
                    })
                  });

                  const resJson = await response.json();

                  if (resJson.error) {
                    lastErrorMsg = resJson.error.message;
                    if (resJson.error.code === 503) {
                      await wait(1500);
                      continue;
                    }
                    break;
                  }

                  if (resJson.candidates && resJson.candidates[0]?.content?.parts?.[0]?.text) {
                    result = resJson;
                    break;
                  }
                } catch (e) {
                  lastErrorMsg = e.message;
                  await wait(1000);
                }
              }
              if (result) break;
            }

            if (!result) {
              throw new Error("伺服器高峰塞車中，請稍候重試：" + lastErrorMsg);
            }

            const rawText = result.candidates[0].content.parts[0].text;
            const items = JSON.parse(rawText.replace(/```json|```/g, "").trim());

            if (!Array.isArray(items) || items.length === 0) {
              throw new Error("未能成功解析出餐點，請更換清晰菜單重試。");
            }

            await setDoc(doc(db, "daily_menus", today), {
              date: today,
              items: items,
              updatedAt: new Date().toISOString()
            });

            // 渲染帶有加減數量的表格
            let html = "";
            items.forEach((item, idx) => {
              html += `<tr class="hover:bg-orange-50/50">
                <td class="p-3 font-semibold text-gray-800">${item.name}</td>
                <td class="p-3 text-center font-bold text-gray-700">$${item.price}</td>
                <td class="p-3 text-center">
                  <div class="inline-flex items-center border rounded-lg overflow-hidden bg-white shadow-sm">
                    <button type="button" class="admin-btn-minus px-3 py-1 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold" data-idx="${idx}">-</button>
                    <input type="number" min="0" value="0" class="admin-qty-input w-12 text-center text-sm font-bold border-0 focus:ring-0 outline-none" data-name="${item.name}" data-price="${item.price}" readonly />
                    <button type="button" class="admin-btn-plus px-3 py-1 bg-gray-100 hover:bg-gray-200 text-orange-600 font-bold" data-idx="${idx}">+</button>
                  </div>
                </td>
              </tr>`;
            });
            document.getElementById("menuTableBody").innerHTML = html;

            // 綁定加減事件
            const qtyInputs = document.querySelectorAll(".admin-qty-input");
            document.querySelectorAll(".admin-btn-minus").forEach((btn, i) => {
              btn.addEventListener("click", () => {
                let val = parseInt(qtyInputs[i].value) || 0;
                if (val > 0) {
                  qtyInputs[i].value = val - 1;
                  calcAdminTotal();
                }
              });
            });

            document.querySelectorAll(".admin-btn-plus").forEach((btn, i) => {
              btn.addEventListener("click", () => {
                let val = parseInt(qtyInputs[i].value) || 0;
                qtyInputs[i].value = val + 1;
                calcAdminTotal();
              });
            });

            document.getElementById("orderSection").classList.remove("hidden");
            statusDiv.innerText = "✔ 菜單辨識完成！請在下方進行步驟 2。";
            document.getElementById("orderSection").scrollIntoView({ behavior: "smooth" });
          } catch (err) {
            console.error(err);
            alert("辨識提示：" + err.message);
            statusDiv.innerText = "請稍候重試。";
          }
        };
        reader.readAsDataURL(file);

      } catch (err) {
        console.error(err);
        alert("讀取金鑰失敗：" + err.message);
        statusDiv.innerText = "讀取設定失敗。";
      }
    });

    function calcAdminTotal() {
      let sum = 0;
      let pieces = 0;
      document.querySelectorAll(".admin-qty-input").forEach(input => {
        const qty = parseInt(input.value) || 0;
        const price = parseInt(input.dataset.price) || 0;
        sum += qty * price;
        pieces += qty;
      });
      document.getElementById("adminTotalAmountText").innerText = `$${sum}`;
      document.getElementById("adminTotalPiecesText").innerText = `已選 ${pieces} 份`;
    }

    document.getElementById("adminSubmitBtn").addEventListener("click", async () => {
      const name = document.getElementById("adminNameInput").value.trim();
      if (!name) return alert("請輸入團主姓名！");

      const items = [];
      document.querySelectorAll(".admin-qty-input").forEach(input => {
        const qty = parseInt(input.value) || 0;
        const itemName = input.dataset.name;
        const itemPrice = parseInt(input.dataset.price);

        for (let i = 0; i < qty; i++) {
          items.push({ name: itemName, price: itemPrice });
        }
      });

      if (items.length === 0) return alert("請至少選擇 1 份餐點！");

      try {
        await addDoc(collection(db, "orders"), {
          person: name,
          items,
          date: today,
          timestamp: new Date().toISOString()
        });

        const orderUrl = window.location.href.replace("admin_menu.html", "order.html");
        document.getElementById("shareUrl").value = orderUrl;

        document.getElementById("nextStepSection").classList.remove("hidden");
        document.getElementById("nextStepSection").scrollIntoView({ behavior: "smooth" });
        alert(`✔ 團主【${name}】點餐已送出（共 ${items.length} 份）！請複製步驟 3 的連結發給同事。`);
      } catch (err) {
        alert("儲存訂單失敗：" + err.message);
      }
    });

    document.getElementById("copyBtn").addEventListener("click", () => {
      const shareUrlInput = document.getElementById("shareUrl");
      shareUrlInput.select();
      navigator.clipboard.writeText(shareUrlInput.value);
      alert("✔ 點餐連結已複製到剪貼簿！可直接貼至 LINE 群組。");
    });
  </script>
</body>
</html>
