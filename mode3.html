<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>手機截圖分帳</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-yellow-50 flex items-center justify-center min-h-screen p-4">
  <div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-lg">
    <div class="flex justify-between items-center mb-4">
      <h1 class="text-2xl font-bold text-yellow-600">📱 手機截圖分帳</h1>
      <button onclick="location.href='index.html'" class="text-sm px-3 py-1 bg-gray-200 rounded hover:bg-gray-300">回首頁</button>
    </div>

    <!-- 步驟 1: 付款人與截圖辨識 -->
    <div class="mb-4">
      <label class="block text-sm font-bold text-gray-700 mb-1">1. 今日付款人 (墊款人)</label>
      <input type="text" id="payerInput" placeholder="請輸入付款人姓名" class="w-full p-2 border rounded mb-3" />

      <label class="block text-sm font-bold text-gray-700 mb-1">2. 上傳手機外送截圖</label>
      <input type="file" id="uploadBtn" accept="image/*" class="w-full text-sm mb-3" />
      <button type="button" id="scanBtn" class="w-full py-2 bg-yellow-500 text-white rounded font-bold hover:bg-yellow-600 transition">
        🔍 辨識截圖品項
      </button>
      <div id="scanStatus" class="text-sm text-gray-600 mt-2 font-medium hidden text-center">辨識中...</div>
    </div>

    <!-- 步驟 2: 貼上人名名單 -->
    <div id="stepNameSection" class="border-t pt-4 hidden">
      <label class="block text-sm font-bold text-gray-700 mb-1">3. 貼上點餐人名名單 (一行一個或空格分開)</label>
      <textarea id="namesInput" rows="3" class="w-full p-2 border rounded text-sm placeholder-gray-400 mb-2" placeholder="例如：&#10;小陳&#10;小黃&#10;大黃"></textarea>
      <button type="button" id="generateSelectBtn" class="w-full py-2 bg-blue-600 text-white rounded font-bold hover:bg-blue-700 transition">
        👇 產生餐點分配表
      </button>
    </div>

    <!-- 步驟 3: 餐點固定，下拉選取點餐人 -->
    <div id="mappingSection" class="border-t pt-4 mt-4 hidden">
      <div class="flex justify-between items-center mb-2">
        <h3 class="font-bold text-gray-800">4. 為每道餐點指派是誰吃的：</h3>
        <span class="text-xs text-gray-500">（一人可重複選多份餐）</span>
      </div>
      <div id="mappingList" class="space-y-3 mb-4 max-h-64 overflow-y-auto pr-1"></div>

      <button type="button" id="calcFinalBtn" class="w-full py-2 bg-yellow-600 text-white rounded-lg font-bold hover:bg-yellow-700 transition shadow">
        ⚡ 計算分帳並平攤費用
      </button>
    </div>

    <!-- 步驟 4: 結算明細 -->
    <div id="resultBox" class="border-t pt-4 mt-4 hidden">
      <h3 class="font-bold text-gray-800 mb-2">📊 結算明細：</h3>
      <div id="calcSummary" class="text-sm text-gray-700 bg-gray-50 p-3 rounded mb-3 space-y-1"></div>
      <button type="button" id="copyMsgBtn" class="w-full py-2 bg-green-600 text-white rounded text-sm font-bold hover:bg-green-700 transition">
        📋 複製分帳明細發 LINE 群組
      </button>
    </div>
  </div>

  <script type="module">
    import { db } from "./firebase.js";
    import { collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const API_KEY = "AQ.Ab8RN6KZ3gCdjgbtNPVjl8ufctWw13hpvXdy-uPa3SjdGUvO7A";
    const today = new Date().toISOString().split("T")[0];

    // 備援模型清單：若首選 503 塞車，會自動依序切換重試
    const MODELS_TO_TRY = ["gemini-2.5-flash", "gemini-2.0-flash", "gemini-1.5-flash", "gemini-3.6-flash"];

    let parsedItems = [];
    let extraFees = { deliveryFee: 0, serviceFee: 0, discount: 0 };
    let shareMessage = "";

    // 1. AI 辨識截圖 (具備自動重試與切換備援模型機制)
    document.getElementById("scanBtn").addEventListener("click", async () => {
      const payer = document.getElementById("payerInput").value.trim();
      const fileInput = document.getElementById("uploadBtn");
      const statusDiv = document.getElementById("scanStatus");

      if (!payer) return alert("請先輸入付款人！");
      if (!fileInput.files[0]) return alert("請選擇外送截圖！");

      statusDiv.classList.remove("hidden");
      statusDiv.innerText = "⏳ AI 正在辨識截圖中的餐點品項與費用...";

      const reader = new FileReader();
      reader.onloadend = async () => {
        const base64Image = reader.result.split(",")[1];
        const prompt = `
請辨識這張外送平台截圖：
1. 找出所有餐點/飲料名稱、數量與金額。若某品項數量大於 1，請拆成多個獨立的項目放入 items 陣列中。
2. 找出外送費 (deliveryFee)、服務費/平台費 (serviceFee)、折扣減免 (discount)。沒有則填 0。
3. 輸出純 JSON 格式，不要包含 Markdown 標記：
{
  "items": [
    {"name": "餐點名稱", "price": 金額數字}
  ],
  "deliveryFee": 0,
  "serviceFee": 0,
  "discount": 0
}
`;

        let result = null;
        let lastErrorMsg = "";

        // 自動輪替模型呼叫
        for (const model of MODELS_TO_TRY) {
          try {
            statusDiv.innerText = `⏳ AI 辨識中 (使用 ${model})...`;
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${API_KEY}`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                contents: [{
                  parts: [
                    { text: prompt },
                    { inline_data: { mime_type: fileInput.files[0].type || "image/png", data: base64Image } }
                  ]
                }],
                generationConfig: { response_mime_type: "application/json" }
              })
            });

            const resJson = await response.json();
            if (resJson.error) {
              lastErrorMsg = resJson.error.message;
              console.warn(`模型 ${model} 忙碌或出錯:`, resJson.error);
              continue; // 遇到 503 或錯誤，換下一個模型
            }

            if (resJson.candidates && resJson.candidates[0]?.content?.parts?.[0]?.text) {
              result = resJson;
              break; // 成功取得回傳，跳出迴圈
            }
          } catch (e) {
            lastErrorMsg = e.message;
          }
        }

        if (!result) {
          alert("辨識失敗（Google 伺服器目前流量過大）：" + lastErrorMsg);
          statusDiv.innerText = "辨識失敗，請稍後再試。";
          return;
        }

        try {
          const rawText = result.candidates[0].content.parts[0].text;
          const parsed = JSON.parse(rawText.replace(/```json|```/g, "").trim());

          parsedItems = parsed.items || [];
          extraFees = {
            deliveryFee: parseInt(parsed.deliveryFee) || 0,
            serviceFee: parseInt(parsed.serviceFee) || 0,
            discount: parseInt(parsed.discount) || 0
          };

          if (parsedItems.length === 0) throw new Error("未能辨識出品項，請更換截圖重試。");

          statusDiv.innerText = `✔ 辨識成功！共抓出 ${parsedItems.length} 道餐點，請輸入點餐人名單。`;
          document.getElementById("stepNameSection").classList.remove("hidden");
        } catch (err) {
          console.error(err);
          alert("解析資料失敗：" + err.message);
          statusDiv.innerText = "解析失敗。";
        }
      };
      reader.readAsDataURL(fileInput.files[0]);
    });

    // 2. 貼上人名後，產生「餐點明細 + 人名下拉選單」
    document.getElementById("generateSelectBtn").addEventListener("click", () => {
      const namesRaw = document.getElementById("namesInput").value.trim();
      if (!namesRaw) return alert("請貼上點餐人名！");

      const names = namesRaw.split(/[\n,， ]+/).filter(n => n.trim().length > 0);
      if (names.length === 0) return alert("未能解析出人名！");

      let optionsHtml = `<option value="">-- 請選擇是誰吃的 --</option>`;
      names.forEach(name => {
        optionsHtml += `<option value="${name}">${name}</option>`;
      });

      let containerHtml = "";
      parsedItems.forEach((item, idx) => {
        containerHtml += `
          <div class="flex items-center justify-between gap-2 p-2 bg-gray-50 border rounded item-row" data-name="${item.name}" data-price="${item.price}">
            <div class="text-sm font-semibold text-gray-800 w-3/5 truncate">
              ${item.name} <span class="text-orange-600">($${item.price})</span>
            </div>
            <select class="person-select w-2/5 p-1.5 border rounded text-xs bg-white">
              ${optionsHtml}
            </select>
          </div>
        `;
      });

      document.getElementById("mappingList").innerHTML = containerHtml;
      document.getElementById("mappingSection").classList.remove("hidden");
      document.getElementById("mappingSection").scrollIntoView({ behavior: "smooth" });
    });

    // 3. 計算分帳與平攤
    document.getElementById("calcFinalBtn").addEventListener("click", async () => {
      const payer = document.getElementById("payerInput").value.trim();
      const rows = document.querySelectorAll(".item-row");

      let people = {};
      let itemDetails = {};
      let unassignedCount = 0;

      rows.forEach(row => {
        const itemName = row.dataset.name;
        const price = parseInt(row.dataset.price);
        const person = row.querySelector(".person-select").value;

        if (!person) {
          unassignedCount++;
          return;
        }

        if (!people[person]) {
          people[person] = 0;
          itemDetails[person] = [];
        }

        people[person] += price;
        itemDetails[person].push(`${itemName}($${price})`);
      });

      if (unassignedCount > 0) {
        return alert(`尚有 ${unassignedCount} 道餐點未選擇點餐人，請指派完畢！`);
      }

      const personKeys = Object.keys(people);
      const count = personKeys.length;
      if (count === 0) return alert("請指派至少一位點餐人員！");

      const netExtra = extraFees.deliveryFee + extraFees.serviceFee - extraFees.discount;
      const baseExtraPerPerson = Math.floor(netExtra / count);
      const remainder = netExtra - (baseExtraPerPerson * count);

      personKeys.forEach(p => {
        people[p] += baseExtraPerPerson;
      });

      if (people[payer] !== undefined) {
        people[payer] += remainder;
      } else {
        people[personKeys[0]] += remainder;
      }

      try {
        await addDoc(collection(db, "settlements"), {
          payer,
          people,
          netExtra,
          date: today,
          timestamp: new Date().toISOString()
        });
      } catch (e) {
        console.error("Firebase 寫入跳過:", e);
      }

      let detailHtml = "";
      let textMsg = `📱 手機訂單分帳結算 (付款人: ${payer})\n`;
      textMsg += `──────────────\n`;

      personKeys.forEach(p => {
        const itemsStr = itemDetails[p].join(" + ");
        detailHtml += `<div class="flex justify-between"><span>• <b>${p}</b>：${itemsStr}</span><span class="font-bold text-yellow-700">$${people[p]}</span></div>`;
        textMsg += `${p}：$${people[p]} (${itemsStr})\n`;
      });

      textMsg += `──────────────\n附加/折讓淨平攤：$${netExtra} (每人 $${baseExtraPerPerson})\n請記得轉帳給 ${payer}，感謝！`;
      shareMessage = textMsg;

      document.getElementById("calcSummary").innerHTML = detailHtml + `<div class="text-xs text-gray-500 mt-2 border-t pt-2">附加費/折扣淨平攤：$${netExtra}（已平攤至應收總額）</div>`;
      document.getElementById("resultBox").classList.remove("hidden");
      document.getElementById("resultBox").scrollIntoView({ behavior: "smooth" });
    });

    // 4. 一鍵複製發 LINE
    document.getElementById("copyMsgBtn").addEventListener("click", () => {
      navigator.clipboard.writeText(shareMessage);
      alert("✔ 分帳結果已複製，可直接貼到 LINE！");
    });
  </script>
</body>
</html>
