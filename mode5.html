<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>外送分帳統計明細</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-50 min-h-screen p-4 md:p-8">
  <div class="max-w-5xl mx-auto bg-white p-6 md:p-8 rounded-2xl shadow-xl">
    
    <!-- 頂部標題與工具列 -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b pb-4 mb-6">
      <div>
        <h1 class="text-2xl md:text-3xl font-extrabold text-blue-700">💰 外送分帳統計明細</h1>
        <p class="text-sm text-gray-500 mt-1">即時查詢墊款結算紀錄、每人平攤應付金額與轉帳對帳明細</p>
      </div>
      <div class="flex items-center gap-3">
        <label class="text-sm font-bold text-gray-700">選擇日期：</label>
        <input type="date" id="dateFilter" class="border rounded-lg p-2 text-sm font-semibold bg-gray-50 focus:ring-2 focus:ring-blue-400 outline-none" />
        <button onclick="location.href='index.html'" class="px-4 py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded-lg text-sm font-bold transition">回首頁</button>
      </div>
    </div>

    <!-- 載入中狀態 -->
    <div id="loadingStatus" class="text-center py-12 text-gray-500 font-medium">資料載入中...</div>

    <!-- 分帳紀錄列表 -->
    <div id="settlementsContainer" class="hidden space-y-6"></div>

  </div>

  <script type="module">
    import { db } from "./firebase.js";
    import { collection, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    let unsubscribe = null;
    const dateInput = document.getElementById("dateFilter");
    dateInput.value = new Date().toISOString().split("T")[0]; // 預設今天

    function listenSettlements(selectedDate) {
      if (unsubscribe) unsubscribe();

      const loadingDiv = document.getElementById("loadingStatus");
      const container = document.getElementById("settlementsContainer");

      loadingDiv.classList.remove("hidden");
      container.classList.add("hidden");

      const q = query(collection(db, "settlements"), where("date", "==", selectedDate));

      unsubscribe = onSnapshot(q, (snapshot) => {
        loadingDiv.classList.add("hidden");
        container.classList.remove("hidden");
        container.innerHTML = "";

        if (snapshot.empty) {
          container.innerHTML = `
            <div class="text-center py-12 text-gray-400 bg-gray-50 rounded-xl border">
              <p class="text-base font-bold">該日期（${selectedDate}）查無分帳結算紀錄</p>
              <p class="text-xs text-gray-400 mt-1">請確認是否已在「外送群組明細分帳」或「手機截圖分帳」完成結算送出。</p>
            </div>
          `;
          return;
        }

        snapshot.forEach((docSnap, index) => {
          const data = docSnap.data();
          const payer = data.payer || "未指定付款人";
          const netExtra = data.netExtra || 0;
          const people = data.people || {};
          const timestamp = data.timestamp ? new Date(data.timestamp).toLocaleTimeString("zh-TW", { hour: "2-digit", minute: "2-digit" }) : "";

          // 計算總金額
          let grandTotal = 0;
          Object.values(people).forEach(val => grandTotal += parseInt(val) || 0);

          let cardHtml = `
            <div class="border rounded-xl bg-gray-50/70 p-5 shadow-sm space-y-4">
              <!-- 單據頂部 -->
              <div class="flex flex-col sm:flex-row justify-between sm:items-center gap-2 border-b pb-3">
                <div class="flex items-center gap-2">
                  <span class="bg-blue-600 text-white text-xs px-2.5 py-1 rounded-full font-bold">結算紀錄 #${index + 1}</span>
                  <span class="text-sm font-bold text-gray-700">墊款人：<span class="text-blue-700 font-extrabold text-base">${payer}</span></span>
                  ${timestamp ? `<span class="text-xs text-gray-400">(${timestamp})</span>` : ""}
                </div>
                <div class="text-xs text-gray-500 font-medium">
                  附加/折扣淨額：<span class="font-bold text-gray-700">$${netExtra}</span>
                </div>
              </div>

              <!-- 分帳清單表格 -->
              <div class="overflow-x-auto bg-white rounded-lg border">
                <table class="w-full text-left text-sm">
                  <thead>
                    <tr class="bg-blue-100 text-blue-900 border-b">
                      <th class="p-3 font-bold w-1/3">姓名</th>
                      <th class="p-3 font-bold text-center w-1/3">轉帳對象</th>
                      <th class="p-3 font-bold text-right w-1/3">應轉金額（含平攤）</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y">
          `;

          let shareText = `🍱 外送分帳結算 (付款人: ${payer})\n──────────────\n`;

          Object.keys(people).forEach(person => {
            const amount = people[person];
            const isPayer = (person === payer);
            shareText += `${person}：$${amount}${isPayer ? ' (本人代墊)' : ` 需轉給 ${payer}`}\n`;

            cardHtml += `
              <tr class="hover:bg-blue-50/30">
                <td class="p-3 font-semibold text-gray-800">
                  ${person} ${isPayer ? '<span class="ml-1 text-xs bg-amber-100 text-amber-700 px-1.5 py-0.5 rounded font-bold">付款墊款人</span>' : ''}
                </td>
                <td class="p-3 text-center text-gray-500">
                  ${isPayer ? '<span class="text-xs text-gray-400">-</span>' : `轉帳給 ${payer}`}
                </td>
                <td class="p-3 text-right font-extrabold ${isPayer ? 'text-gray-600' : 'text-blue-700'} text-base">
                  $${amount}
                </td>
              </tr>
            `;
          });

          shareText += `──────────────\n總計費用：$${grandTotal} 元\n請記得轉帳給 ${payer}，感謝！`;

          cardHtml += `
                  </tbody>
                </table>
              </div>

              <!-- 底部操作按鈕與總計 -->
              <div class="flex flex-col sm:flex-row justify-between items-center gap-3 pt-2">
                <span class="font-bold text-gray-700 text-sm">此單總結算金額：<span class="text-blue-700 text-lg font-extrabold">$${grandTotal}</span></span>
                <button type="button" class="copy-settle-btn w-full sm:w-auto px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-xs font-bold shadow transition" data-text="${encodeURIComponent(shareText)}">
                  📋 複製此筆分帳明細發 LINE
                </button>
              </div>
            </div>
          `;

          container.innerHTML += cardHtml;
        });

        // 綁定複製按鈕事件
        document.querySelectorAll(".copy-settle-btn").forEach(btn => {
          btn.addEventListener("click", (e) => {
            const raw = decodeURIComponent(e.currentTarget.dataset.text);
            navigator.clipboard.writeText(raw);
            alert("✔ 分帳結果已複製到剪貼簿，可直接貼至 LINE！");
          });
        });

      }, (error) => {
        loadingDiv.innerHTML = `<div class="text-red-500 font-bold">讀取分帳資料失敗：${error.message}</div>`;
      });
    }

    listenSettlements(dateInput.value);
    dateInput.addEventListener("change", (e) => listenSettlements(e.target.value));
  </script>
</body>
</html>
